name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check expected files
        run: |
          ls -la app/
          ls -la app/base/
          ls -la app/modules/ | head -20
      - name: Build pandora-dee.html
        run: |
          python3 -u app/build.py || {
            echo "BUILD FAILED; dumping app/base/pi-netrunner-mobile.html first 200 lines for diagnostics"
            head -n 200 app/base/pi-netrunner-mobile.html
            exit 1
          }
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pandora-dee-html
          path: dist/pandora-dee.html
          if-no-files-found: error
