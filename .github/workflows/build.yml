name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check expected files
        run: |
          ls -la app/
          ls -la app/base/
          ls -la app/modules/ | head -20
          ls -la node_modules/katex/dist/
      - name: Build pandora-dee.html
        run: |
          python3 -u app/build.py > build.log 2>&1 || {
            echo "BUILD FAILED; build.log follows:"
            cat build.log
            echo "--- end build.log ---"
            exit 1
          }
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pandora-dee-html
          path: dist/pandora-dee.html
          if-no-files-found: error
