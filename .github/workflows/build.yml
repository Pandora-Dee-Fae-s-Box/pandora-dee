name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # build.py reads katex, marked, dompurify and pdfjs from node_modules
      - run: npm install --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # the whole web build, as ci.yml does it (jade-link.xdc first, which build.py needs, then build.py, tw.css,
      # index.html). Its output shows in the log as it happens and goes to build.log; on a failure the end of the
      # log (the real error, such as an anchor build.py couldn't find) is printed again at the bottom.
      - name: Build pandora-dee.html
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log || {
            echo "::error::BUILD FAILED. The end of build.log:"
            tail -n 60 build.log
            exit 1
          }
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pandora-dee-html
          path: dist/pandora-dee.html
          if-no-files-found: error
